name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  cloud:
    name: Cloud lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app tests
      - name: Pytest
        run: pytest -q

  dashboard:
    name: Dashboard typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Format helpers
        run: node scripts/format.test.mjs

  compose:
    name: Compose config & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config
      - name: Build images
        run: docker compose build
